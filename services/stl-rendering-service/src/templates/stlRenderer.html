<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STL/3MF Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

    // Globals set by Puppeteer before calling renderImage():
    //   window.modelData    — base64-encoded STL or 3MF
    //   window.modelFormat  — "stl" or "3mf"
    //   window.renderOptions — { width, height, angle }

    function setupScene(options) {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf0f0f0);

      const camera = new THREE.PerspectiveCamera(
        75,
        options.width / options.height,
        0.1,
        10000
      );

      const renderer = new THREE.WebGLRenderer({
        antialias: false,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(options.width, options.height);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = false;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // 5-light rig
      scene.add(new THREE.AmbientLight(0xffffff, 0.3));

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
      keyLight.position.set(100, 150, 100);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
      fillLight.position.set(-100, 50, -50);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
      rimLight.position.set(0, 50, -150);
      scene.add(rimLight);

      const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
      topLight.position.set(0, 200, 0);
      scene.add(topLight);

      return { scene, camera, renderer };
    }

    function positionCamera(camera, angle, distance, modelCenterY) {
      // All cameras look at the model center and are exactly `distance` away from it
      const lookAt = new THREE.Vector3(0, modelCenterY, 0);

      switch (angle) {
        case 'front':
          camera.position.set(0, modelCenterY, distance);
          break;
        case 'top':
          // Place camera `distance` above the lookAt point (not above the origin)
          camera.position.set(0, modelCenterY + distance, 0.001);
          break;
        case 'isometric': {
          // (d,d,d) offset from lookAt — magnitude is d*sqrt(3), so d = distance/sqrt(3)
          const d = distance / Math.sqrt(3);
          camera.position.set(d, modelCenterY + d, d);
          break;
        }
        default:
          camera.position.set(0, modelCenterY, distance);
      }

      camera.lookAt(lookAt);
      camera.updateProjectionMatrix();
    }

    function decodeBase64(data) {
      const binary = atob(data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function centerAndGround(object, box) {
      const center = new THREE.Vector3();
      box.getCenter(center);
      object.position.sub(center);

      const size = new THREE.Vector3();
      box.getSize(size);
      object.position.y += size.y / 2;

      return size;
    }

    function loadSTL(arrayBuffer) {
      const loader = new STLLoader();
      const geometry = loader.parse(arrayBuffer);

      // Build123d uses Z-up; Three.js uses Y-up — rotate to match
      geometry.rotateX(-Math.PI / 2);

      const material = new THREE.MeshStandardMaterial({
        color: 0x2196f3,
        metalness: 0.1,
        roughness: 0.6,
        side: THREE.DoubleSide,
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      geometry.computeBoundingBox();
      const size = centerAndGround(mesh, geometry.boundingBox);

      return { object: mesh, size };
    }

    async function load3MF(arrayBuffer) {
      const blob = new Blob([arrayBuffer]);
      const objectUrl = URL.createObjectURL(blob);

      try {
        const loader = new ThreeMFLoader();
        const group = await loader.loadAsync(objectUrl);

        // Build123d uses Z-up; Three.js uses Y-up — rotate each mesh geometry
        group.traverse((child) => {
          if (child.isMesh && child.geometry) {
            child.geometry.rotateX(-Math.PI / 2);
          }
        });

        // Apply default material to any meshes without color
        group.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.side = THREE.DoubleSide;
            }
          }
        });

        const box = new THREE.Box3().setFromObject(group);
        const size = centerAndGround(group, box);

        return { object: group, size };
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    // Render all angles in one call — loads model once, repositions camera per angle
    // Page is reused across requests; cleanup removes all scene objects + renderer canvas
    window.renderAllAngles = async function () {
      const modelData = window.modelData;
      const modelFormat = window.modelFormat || 'stl';
      const angles = window.renderAngles || ['front', 'top', 'isometric'];
      const options = window.renderOptions || { width: 256, height: 256 };

      if (!modelData) {
        throw new Error('No model data provided');
      }

      // Clear any leftover canvas from previous render
      const container = document.getElementById('canvas-container');
      container.innerHTML = '';

      const { scene, camera, renderer } = setupScene(options);
      const arrayBuffer = decodeBase64(modelData);

      let result;
      if (modelFormat === '3mf') {
        result = await load3MF(arrayBuffer);
      } else {
        result = loadSTL(arrayBuffer);
      }

      scene.add(result.object);

      const maxDim = Math.max(result.size.x, result.size.y, result.size.z);
      const distance = maxDim * 2.5;
      const modelCenterY = result.size.y / 2;

      const images = [];
      for (const angle of angles) {
        positionCamera(camera, angle, distance, modelCenterY);
        renderer.render(scene, camera);
        images.push({
          angle,
          dataUrl: renderer.domElement.toDataURL('image/png'),
        });
      }

      // Cleanup: dispose all GPU resources and remove canvas
      scene.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach((m) => m.dispose());
          } else {
            obj.material.dispose();
          }
        }
      });
      renderer.dispose();
      container.innerHTML = '';

      // Clear model data reference so GC can reclaim memory
      window.modelData = null;

      return images;
    };

    window.rendererReady = true;
  </script>
</body>
</html>
